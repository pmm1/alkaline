<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262d"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="560" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9e74" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#e7b77e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8fc59c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="176" x2="0" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9fe6b2"/>
      <stop offset="0.48" stop-color="#f6dc8f"/>
      <stop offset="1" stop-color="#ff9064"/>
    </linearGradient>
    <radialGradient id="shade" cx="390" cy="430" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#7a2a10" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a2a10" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <path id="dropPath" d="M512 176 C470 252 300 420 300 612 C300 729 395 824 512 824 C629 824 724 729 724 612 C724 420 554 252 512 176 Z"/>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>

  <g transform="translate(512 500) scale(1.1) translate(-512 -500)">
    <use href="#dropPath" fill="url(#drop)" opacity="0.6" filter="url(#glow)" transform="translate(0 26)"/>
    <use href="#dropPath" fill="url(#drop)"/>
    <use href="#dropPath" fill="url(#shade)"/>
    <path d="M426 646 C406 562 430 468 494 368" fill="none" stroke="url(#shine)" stroke-width="40" stroke-linecap="round" opacity="0.8" filter="url(#soft)"/>
    <circle cx="450" cy="712" r="21" fill="#fff" opacity="0.6" filter="url(#soft)"/>
  </g>
