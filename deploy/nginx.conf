# /etc/nginx/sites-available/alkaline
#   sudo ln -s /etc/nginx/sites-available/alkaline /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pmm.is -d www.pmm.is

# www.pmm.is -> pmm.is
server {
    listen 80;
    listen [::]:80;
    server_name www.pmm.is;
    return 301 https://pmm.is$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name pmm.is;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Needed so answers stream in word by word instead of all at once.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
